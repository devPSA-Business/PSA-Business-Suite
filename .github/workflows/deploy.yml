name: 🚀 Deploy — Produksi Firebase Hosting

# ┌──────────────────────────────────────────────────────────────────────┐
# │  PIPELINE DEPLOY PRODUKSI — PSA Business Suite                       │
# │  Trigger : Push ke main (src/public/config berubah) ATAU manual      │
# │  Output  : https://psa-business-suite.web.app  (HTTPS, CDN global)   │
# │  Biaya   : Rp 0/bulan (Firebase Spark Plan)                          │
# │  Notif   : Email ke dev.psajewelry@gmail.com saat sukses/gagal       │
# └──────────────────────────────────────────────────────────────────────┘
#
# SECRETS WAJIB (deploy gagal tanpa ini):
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID, FIREBASE_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID
#   FIREBASE_DEPLOY_TOKEN, VITE_CRYPTO_PEPPER
#
# SECRETS OPSIONAL (fitur disabled jika kosong, app tetap berjalan):
#   VITE_GEMINI_PROXY_URL, VITE_TELEGRAM_BOT_TOKEN, VITE_TELEGRAM_CHAT_ID
#   VITE_RECAPTCHA_SITE_KEY, VITE_SENTRY_DSN, MAIL_USERNAME, MAIL_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "firebase.json"
      - "firestore.rules"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-produksi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy → Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint + TypeScript check
        run: npm run lint

      - name: Build produksi (Vite)
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CRYPTO_PEPPER:                ${{ secrets.VITE_CRYPTO_PEPPER }}
          VITE_RECAPTCHA_SITE_KEY:           ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GEMINI_PROXY_URL:             ${{ secrets.VITE_GEMINI_PROXY_URL }}
          VITE_TELEGRAM_BOT_TOKEN:           ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID:             ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
          VITE_SENTRY_DSN:                   ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy ke Firebase Hosting (live)
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@0cbcac4740c2bfb00d632f0b863b57713124eb5a # v0
        with:
          repoToken:              "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId:              live
          projectId:              "${{ secrets.FIREBASE_PROJECT_ID }}"

      - name: Deploy Firestore Security Rules
        run: |
          npx firebase-tools deploy --only firestore:rules \
            --project "${{ secrets.FIREBASE_PROJECT_ID }}" \
            --token   "${{ secrets.FIREBASE_DEPLOY_TOKEN }}"

      - name: Ringkasan deploy
        if: success()
        run: |
          echo "## ✅ Deploy Produksi Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Nilai |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL** | https://psa-business-suite.web.app |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit**   | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

      - name: Email — Deploy berhasil
        if: success() && secrets.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@2cea9617b09d83a6b1cfef2f3f9b1a8c6aabe99a # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port:    465
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        "[PSA] ✅ Deploy Berhasil — ${{ github.sha }}"
          to:             dev.psajewelry@gmail.com
          from:           PSA Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy PSA Business Suite ke produksi BERHASIL.

            Live URL : https://psa-business-suite.web.app
            Commit   : ${{ github.sha }}
            Pesan    : ${{ github.event.head_commit.message }}

            — PSA CI/CD Bot 🤖

      - name: Email — Deploy gagal
        if: failure() && secrets.MAIL_USERNAME != ''
        uses: dawidd6/action-send-mail@2cea9617b09d83a6b1cfef2f3f9b1a8c6aabe99a # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port:    465
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        "[PSA] ❌ Deploy GAGAL — Perlu Perhatian"
          to:             dev.psajewelry@gmail.com
          from:           PSA Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy PSA Business Suite GAGAL.

            Commit : ${{ github.sha }}
            Log    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            — PSA CI/CD Bot 🤖
