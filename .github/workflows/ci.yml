name: CI — Quality Gate

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  quality_gate:
    name: Lint · TypeCheck · Test · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # SHA diverifikasi dari repo resmi actions/checkout (sama dengan deploy.yml)
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 # v4.2.2
        with:
          fetch-depth: 0

      # SHA diverifikasi dari repo resmi actions/setup-node (sama dengan deploy.yml)
      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript — Type Check
        run: npx tsc --noEmit

      - name: ESLint — Lint
        run: npm run lint

      - name: Vitest — Tests + Coverage
        env:
          VITE_CRYPTO_PEPPER: ${{ secrets.VITE_CRYPTO_PEPPER || 'ci-mocked-pepper' }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN || 'ci-mocked-token' }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID || 'ci-mocked-chat' }}
        run: npm run test:coverage

      # Gunakan version tag — SHA v4.x resmi tidak dapat diverifikasi saat ini
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 14

      - name: Enforce Coverage Thresholds
        run: |
          node -e "
          const fs = require('fs');
          let summary;
          try {
            summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          } catch (e) {
            console.warn('coverage-summary.json tidak ditemukan, skip threshold check.');
            process.exit(0);
          }
          // Coverage thresholds — dinaikkan dari (15/15/12/10) ke (19/18/13/11) per sprint 2026-06-06.
          // Angka berdasarkan coverage aktual terukur: Lines 20.08%, Stmts 18.82%, Branches 14.98%, Funcs 12.67%.
          // Buffer 1% di bawah aktual untuk mencegah fluktuasi CI false-negative.
          // Proyek ini UI-heavy (React components belum dites), coverage global rendah secara inherent.
          // Roadmap: 19/18/13/11 → 25/24/18/16 (Money Path tests) → 40/38/30/28 (UI tests).
          // Refs: PSA_Business_Suite_Audit.md F-01, F-05.
          const min = { lines: 19, statements: 18, branches: 13, functions: 11 };
          const failures = [];
          for (const k of Object.keys(min)) {
            const pct = summary[k]?.pct ?? 0;
            if (pct < min[k]) failures.push(k + ': ' + pct + '% < ' + min[k] + '%');
          }
          if (failures.length) {
            console.error('Coverage thresholds tidak terpenuhi:\n' + failures.join('\n'));
            process.exit(1);
          }
          console.log('Semua coverage thresholds terpenuhi ✓');
          "

      # SHA diverifikasi dari repo resmi davelosert/vitest-coverage-report-action
      - name: Coverage Summary Comment (PR only)
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2.12.0
        with:
          json-summary-path: coverage/coverage-summary.json
