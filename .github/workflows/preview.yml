name: Preview — Firebase Hosting (Dev Channel)

# @ai_context: Deploy ke Firebase Hosting PREVIEW CHANNEL untuk branch non-main.
# Preview channel = URL temporary gratis, TERPISAH dari produksi.
# Tujuan: owner/developer bisa cek perubahan UI/UX sebelum merge ke main.
#
# ARSITEKTUR DEV/PROD:
#   main branch      → https://psa-business-suite.web.app          (PRODUKSI)
#   PR / develop     → https://psa-business-suite--pr-NNN-hash.web.app  (PREVIEW)
#
# Preview channel OTOMATIS:
#   - Dibuat saat PR dibuka
#   - URL diposting sebagai komentar di PR
#   - Dihapus otomatis 7 hari setelah PR ditutup (tidak ada biaya tersisa)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  # P2-3 CI Pruning (2026-06-08): Batasi push trigger ke develop saja.
  # Sebelum: ui/**, ux/**, feature/**, fix/** semua men-trigger Firebase Preview Channel deploy.
  # Ini overhead signifikan — setiap commit ke branch kerja = 1 Firebase deploy.
  # Sesudah: hanya develop yang auto-deploy preview. Feature branches pakai workflow_dispatch.
  push:
    branches: [develop]
  # Manual trigger: gunakan ini untuk preview feature branch tanpa harus push ke develop.
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan trigger manual preview'
        required: false
        default: 'Manual preview check'

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview_deploy:
    name: Build → Deploy Preview Channel
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Skip preview deploy jika Firebase secrets belum dikonfigurasi.
    # Ini mencegah CI fail merah untuk setiap PR hanya karena secrets belum diset.
    # Preview deploy baru aktif setelah owner set FIREBASE_SERVICE_ACCOUNT di repo secrets.
    # Ref: PSA_GOVERNANCE.md Bagian D1 — tindakan yang hanya bisa dilakukan owner.
    #
    # CATATAN: gate ini SENGAJA tidak lagi berupa job-level `if: secrets.X != ''`.
    # `secrets` bukan context yang tersedia di jobs.<job_id>.if (lihat "Context
    # availability" di docs.github.com/actions) — GitHub menolak SELURUH file ini
    # sebelum satu job pun dijadwalkan ("Unrecognized named-value: 'secrets'").
    # Gate yang benar dipindah ke step "Pre-flight" di bawah (step output, bukan
    # secrets context, sehingga valid dipakai di jobs.<job_id>.steps.if).

    permissions:
      contents: read
      pull-requests: write  # Untuk posting komentar URL preview ke PR

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Pre-flight — Cek Firebase Service Account
        id: preflight
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "⚠️  Preview deploy dilewati — FIREBASE_SERVICE_ACCOUNT belum diset."
            echo "Cara set: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "HAS_SA=false" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Pre-flight OK — FIREBASE_SERVICE_ACCOUNT tersedia"
            echo "HAS_SA=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Preview
        if: steps.preflight.outputs.HAS_SA == 'true'
        run: npm run build
        env:
          # Firebase Core — sama dengan produksi
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          # Security
          VITE_CRYPTO_PEPPER: ${{ secrets.VITE_CRYPTO_PEPPER }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          # AI Proxy (dev pakai proxy yang sama dengan produksi)
          VITE_GEMINI_PROXY_URL: ${{ secrets.VITE_GEMINI_PROXY_URL }}
          # Flag: ini adalah build PREVIEW — bisa dipakai untuk menampilkan banner dev
          VITE_IS_PREVIEW: 'true'
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # Deploy ke Preview Channel — URL otomatis di-post ke PR
      - name: Deploy ke Firebase Preview Channel
        if: steps.preflight.outputs.HAS_SA == 'true'
        id: preview_deploy
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: '${{ secrets.VITE_FIREBASE_PROJECT_ID }}'
          # channelId TIDAK di-set = otomatis generate per-PR
          expires: 7d   # Preview dihapus otomatis 7 hari setelah PR ditutup

      - name: Summary Preview URL
        if: steps.preflight.outputs.HAS_SA == 'true'
        run: |
          echo "## 🔍 Preview Deploy Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Preview URL** | ${{ steps.preview_deploy.outputs.details_url }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Produksi URL** | https://psa-business-suite.web.app |" >> $GITHUB_STEP_SUMMARY
          echo "| **Expires** | 7 hari setelah PR ditutup |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> Preview ini menggunakan Firestore **PRODUKSI** yang sama." >> $GITHUB_STEP_SUMMARY
          echo "> Hati-hati saat test fitur yang menulis data." >> $GITHUB_STEP_SUMMARY
