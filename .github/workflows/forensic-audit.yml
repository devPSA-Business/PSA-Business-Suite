name: Forensic Audit

# @ai_context: Workflow keamanan mendalam — dijalankan di setiap PR dan push ke main.
# Mencakup: TypeScript strict check, ESLint, dependency audit,
# dan deteksi pelanggaran arsitektur (direct DB write dari UI layer).
# NOTE: CodeQL SAST dijalankan terpisah di codeql.yml — TIDAK diduplikasi di sini.
#
# P2-3 CI Pruning (2026-06-08): Hapus trigger push ke 'develop'.
# Rationale: Semua perubahan ke develop harus lewat PR (branch protection aktif).
# Forensic audit di PR sudah mencakup audit sebelum merge — running ulang
# setelah merge ke develop adalah redundant overhead tanpa nilai tambah.
# Push ke 'main' dipertahankan sebagai post-merge verification safety net.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Job 1: Static Analysis & Architecture Guard ──────────────────────────
  static_analysis:
    name: TypeScript · ESLint · Architecture
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        # --legacy-peer-deps: @firebase/rules-unit-testing@5.x peer-dep conflict
        # dengan firebase@11 (butuh firebase@^12). Flag ini aman dipakai sampai
        # upgrade firebase@12 dilakukan. Ref: CI-FIX-001
        # CI-FIX-002: npm install (bukan npm ci) — konsisten dengan ci.yml setelah fix
        # commit 3cfc39f yang membuktikan npm ci crash di GitHub Actions runner ini.
        run: npm install --legacy-peer-deps

      - name: TypeScript — Strict Type Check
        run: npx tsc --noEmit

      - name: ESLint — Strict (0 warnings allowed)
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0

      # Guard 1: Pastikan tidak ada WRITE DB langsung dari UI layer
      # Membaca db via useLiveQuery di UI adalah BENAR per arsitektur.
      # Yang dilarang: mutasi (add/put/delete/update) ke domain tables dari UI.
      - name: Architecture Guard — No Direct DB Write in UI Layer
        run: |
          echo "Scanning for direct DB write operations in UI layer..."

          # Cari mutasi langsung ke domain tables dari UI/components layer.
          # ALLOWED dari UI: useLiveQuery (reads only), db.keyval (UI ephemeral state),
          # dan tabel infrastruktur non-domain (config dan sync queues).
          # FORBIDDEN: direct write ke tabel domain dari UI layer.(
          VIOLATIONS=$(grep -rn \
            --include="*.ts" --include="*.tsx" \
            -E "await[[:space:]]+db\.(transactions|stock|customers|repair_services|gold_buybacks|shifts|financial_closures|audit_logs|staff_members|users)\.(add|put|delete|update|bulkAdd|bulkPut|bulkDelete|clear|modify)\(" \
            src/features/*/ui/ src/features/*/components/ \
            src/pages/ \
            2>/dev/null \
            | grep -v "@architecture_bypass_approved" \
            || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ PELANGGARAN ARSITEKTUR: UI layer menulis langsung ke domain DB"
            echo "   Semua mutasi WAJIB melalui UseCase → UnitOfWork → Dexie"
            echo ""
            echo "$VIOLATIONS"
            exit 1
          else
            echo "✅ Tidak ada direct DB write di UI layer"
          fi

      # Guard 2: Pastikan tidak ada 'any' di domain/usecases layer
      - name: Architecture Guard — No 'any' in Domain/UseCases
        run: |
          echo "Scanning for 'any' type in domain and usecases layers..."

          VIOLATIONS=$(grep -rn             --include="*.ts"             -E "([: (]any[^a-zA-Z0-9_]|as any[^a-zA-Z0-9_]|<any>)"             src/domain/ src/features/*/usecases/ src/application/             2>/dev/null || true)

          if [ -n "$VIOLATIONS" ]; then
            echo "❌ PELANGGARAN: Tipe 'any' ditemukan di layer Domain/UseCase"
            echo "$VIOLATIONS"
            exit 1
          else
            echo "✅ Tidak ada 'any' di layer Domain/UseCase"
          fi

  # ── Job 2: Dependency Security Audit ─────────────────────────────────────
  dependency_audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 24
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Install dependencies
        # CI-FIX-002: npm install (bukan npm ci) — lihat static_analysis job comment
        run: npm install --legacy-peer-deps

      - name: NPM Audit (high severity)
        run: npm audit --audit-level=high
