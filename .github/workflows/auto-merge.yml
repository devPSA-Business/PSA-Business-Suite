name: Auto-Merge Dependabot

# @ai_context: Otomatisasi merge dependabot untuk update minor/patch yang aman.
# Blokir: major version update dan dependensi kritis (firebase, dexie, auth).
# Trigger: hanya dari dependabot[bot], bukan PR manual.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_merge:
    name: Evaluate and Auto-Merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot Metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate Safety
        id: eval
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          PACKAGE_ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "Update type  : $UPDATE_TYPE"
          echo "Dependencies : $DEPENDENCY_NAMES"
          echo "Ecosystem    : $PACKAGE_ECOSYSTEM"

          SAFE="true"
          REASON=""

          # Blokir 1: Major version update (SELALU blokir — risk of breaking changes)
          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            SAFE="false"
            REASON="Major version update - perlu review manual agar tidak ada breaking change."
          fi

          # Blokir 2: Dependensi kritis — blokir SEMUA update (minor + patch sekalipun).
          # Hanya daftar paket yang mana minor/patch update pun bisa memengaruhi:
          #   - Data integrity (firebase, dexie, decimal.js)
          #   - Security-critical crypto/auth flow
          #   - Build tooling yang pernah terbukti crash (vite, @vitejs/plugin-react)
          #
          # CATATAN IMPLEMENTASI: Gunakan matching EXACT agar tidak false-positive.
          # Dulu pakai 'grep -qi $dep' yang substring-match sehingga:
          #   "vite" cocok dengan "vitest", "@vitest/coverage-v8" → SALAH, over-blocking
          #   "react" cocok dengan "react-is", "@tanstack/react-router" → SALAH
          # Sekarang: split nama dep per spasi/koma, compare lowercase exact.
          #
          # Paket yang sudah di-handle via dependabot.yml ignore rules dan TIDAK perlu
          # masuk sini: @vitejs/plugin-react (minor+major diabaikan di dependabot.yml).
          ALWAYS_BLOCK=(
            "firebase"
            "firebase-admin"
            "@firebase/app"
            "@firebase/auth"
            "@firebase/firestore"
            "@firebase/database"
            "@firebase/storage"
            "dexie"
            "decimal.js"
            "vite"
          )

          # Split DEPENDENCY_NAMES (space/comma separated) dan bandingkan exact lowercase
          IFS=', ' read -ra DEP_LIST <<< "$DEPENDENCY_NAMES"
          for dep_name in "${DEP_LIST[@]}"; do
            dep_lower="${dep_name,,}"  # lowercase
            for critical in "${ALWAYS_BLOCK[@]}"; do
              if [[ "$dep_lower" == "${critical,,}" ]]; then
                SAFE="false"
                REASON="Update dependensi kritis '$dep_name' - potensi data/build breaking. Review manual."
                break 2
              fi
            done
          done

          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          if [[ "$SAFE" == "true" ]]; then
            echo "PR AMAN untuk auto-merge (type: $UPDATE_TYPE)"
          else
            echo "PR DITAHAN - $REASON"
          fi

      - name: Approve PR if Safe
        if: steps.eval.outputs.safe == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved: $UPDATE_TYPE update, CI required to merge."

      - name: Enable Auto-Merge if Safe
        if: steps.eval.outputs.safe == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Label PR if Blocked
        if: steps.eval.outputs.safe == 'false'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.eval.outputs.reason }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="Auto-merge DITAHAN

          Alasan: $REASON

          Tindakan diperlukan:
          1. Buka PR ini: $PR_URL
          2. Cek perubahan (CHANGELOG atau BREAKING CHANGES)
          3. Jika aman - klik Merge pull request
          4. Jika tidak - klik Close pull request"

          gh pr comment "$PR_URL" --body "$COMMENT_BODY"
          gh pr edit "$PR_URL" --add-label "needs-human-review" 2>/dev/null || true
