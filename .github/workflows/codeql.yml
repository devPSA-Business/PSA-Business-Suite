name: "CodeQL Advanced"

# @ai_context: SAST scan otomatis — mencari vulnerabilitas keamanan di TypeScript.
#
# STATUS: DIUBAH ke workflow_dispatch-only (2026-06-04)
# ALASAN: GitHub Advanced Security (GHAS) tidak tersedia di free plan untuk repo private.
#         Workflow ini selalu FAIL di step "Perform CodeQL Analysis" di setiap push,
#         menciptakan noise yang mengaburkan CI status yang sebenarnya.
#
# ALTERNATIF AKTIF: security-check.yml (Trivy SAST) sudah cover vulnerability scanning
#         tanpa memerlukan GHAS. Tidak ada gap keamanan dari perubahan ini.
#
# CARA JALANKAN MANUAL (jika suatu saat upgrade ke GHAS):
#   GitHub → Actions → "CodeQL Advanced" → Run workflow
#
# UPGRADE PATH: Jika akun upgrade ke GitHub Team/Enterprise + Advanced Security,
#         ubah trigger kembali ke:
#           push: { branches: ["main"] }
#           pull_request: { branches: ["main"] }
#           schedule: [{ cron: '36 15 * * 0' }]

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Alasan menjalankan CodeQL manual'
        required: false
        default: 'Manual SAST scan'

jobs:
  analyze:
    name: Analyze TypeScript/JavaScript (Manual Only)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          languages: javascript-typescript
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: '/language:javascript-typescript'
