version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # @vitejs/plugin-react: v6.x = designated plugin for Vite 8.x (peerDeps: vite ^8.0.0).
      # Historical crash (commit 3cfc39f, 2026-06-02) was with Vite 6.x — version MISMATCH.
      # After Vite bump to 8.0.16 (PR#138-ish), 6.x is correct and compatible.
      # Block MAJOR only (v6→v7 would require Vite upgrade). Minor within v6.x = safe.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # firebase + dexie: schema-affecting deps — require manual migration review
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dexie"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@firebase/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
