name: Security Check — Trivy

# @ai_context: Vulnerability scan mingguan menggunakan Trivy.
# Mencakup: filesystem scan untuk CVE HIGH/CRITICAL pada dependencies.
# Berjalan setiap Senin 03:00 UTC dan bisa dipicu manual.

on:
  schedule:
    - cron: '0 3 * * 1' # Senin 03:00 UTC (10:00 WIB)
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy_scan:
    name: Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # SHA dari release resmi aquasecurity/trivy-action (v0.28.0 — Jan 2025)
      # JANGAN gunakan @master — dapat berubah kapan saja (supply chain risk)
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Upload Trivy results to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-filesystem'
          # @ai_context: Scan src/ dan root saja. functions/ sudah diarsipkan (tidak ada di git).
          # Scan hanya pada src/ dan root dependencies
