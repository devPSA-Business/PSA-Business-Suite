version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
      include: "scope"
    ignore:
      # @vitejs/plugin-react: v6.x incompatible with Vite 8 + React 19/Babel combo.
      # Manual upgrade only after verifying full build passes (npm run build).
      # Historical context: 6.0.2 caused P0 build crash (fixed in commit 3cfc39f, 2026-06-02).
      # Current status with Vite 8: UNTESTED in production build. Lock until verified.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # firebase + dexie: schema-affecting deps — require manual migration review
      - dependency-name: "firebase"
        update-types: ["version-update:semver-major"]
      - dependency-name: "dexie"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@firebase/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "firebase-admin"
        update-types: ["version-update:semver-major"]
