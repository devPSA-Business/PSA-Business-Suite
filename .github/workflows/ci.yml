name: CI — Quality Gate

on:
  push:
    branches: [main, develop, 'feature/**', 'fix/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read
  pull-requests: write

jobs:
  quality_gate:
    name: Lint · TypeCheck · Test · Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # SHA diverifikasi dari repo resmi actions/checkout (sama dengan deploy.yml)
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3 # v6.0.3
        with:
          fetch-depth: 0

      # SHA diverifikasi dari repo resmi actions/setup-node (sama dengan deploy.yml)
      - name: Setup Node.js 22
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: TypeScript — Type Check
        run: npx tsc --noEmit

      - name: ESLint — Lint
        run: npm run lint

      - name: Vitest — Tests + Coverage
        env:
          VITE_CRYPTO_PEPPER: ${{ secrets.VITE_CRYPTO_PEPPER || 'ci-mocked-pepper' }}
          VITE_TELEGRAM_BOT_TOKEN: ${{ secrets.VITE_TELEGRAM_BOT_TOKEN || 'ci-mocked-token' }}
          VITE_TELEGRAM_CHAT_ID: ${{ secrets.VITE_TELEGRAM_CHAT_ID || 'ci-mocked-chat' }}
        run: npm run test:coverage

      # Gunakan version tag — SHA v4.x resmi tidak dapat diverifikasi saat ini
      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report-${{ github.sha }}
          path: coverage/
          retention-days: 14

      - name: Enforce Coverage Thresholds
        run: |
          node -e "
          const fs = require('fs');
          let summary;
          try {
            summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8')).total;
          } catch (e) {
            console.warn('coverage-summary.json tidak ditemukan, skip threshold check.');
            process.exit(0);
          }
          // Coverage thresholds — dinaikkan ke (22/21/15/14) per sprint 2026-06-12.
          // Angka berdasarkan coverage aktual terukur di branch batch-d:
          //   Lines: 23.89%, Stmts: 22.33%, Branches: 17.48%, Funcs: 15.66%
          // +18 tests baru: ManageUserUseCase (createUser x6, updateUser x6, deleteUser x6).
          // Mock fixes: BuybackUseCase, DomainSeparation, GoldLiquidationUseCase.
          // Buffer ~1-2% di bawah aktual untuk mencegah fluktuasi CI false-negative.
          // Proyek ini UI-heavy (React components belum dites), coverage global rendah secara inherent.
          // Roadmap: 22/21/15/14 → 28/26/20/18 (Report+Infrastructure tests) → 40/38/30/28 (UI tests).
          // Refs: Audit Komprehensif 2026-06-12, PSA_Business_Suite_Audit.md F-01, F-05.
          const min = { lines: 22, statements: 21, branches: 15, functions: 14 };
          const failures = [];
          for (const k of Object.keys(min)) {
            const pct = summary[k]?.pct ?? 0;
            if (pct < min[k]) failures.push(k + ': ' + pct + '% < ' + min[k] + '%');
          }
          if (failures.length) {
            console.error('Coverage thresholds tidak terpenuhi:\n' + failures.join('\n'));
            process.exit(1);
          }
          console.log('Semua coverage thresholds terpenuhi ✓');
          "

      # SHA diverifikasi dari repo resmi davelosert/vitest-coverage-report-action
      - name: Coverage Summary Comment (PR only)
        if: github.event_name == 'pull_request'
        uses: davelosert/vitest-coverage-report-action@02f3c2e641286b7fa308cd3e430783103ce6103b # v2.12.0
        with:
          json-summary-path: coverage/coverage-summary.json
