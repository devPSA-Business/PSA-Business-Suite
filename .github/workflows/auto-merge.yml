name: Auto-Merge Dependabot

# @ai_context: Otomatisasi merge dependabot untuk update minor/patch yang aman.
# Blokir: major version update dan dependensi kritis (firebase, dexie, auth).
# Trigger: hanya dari dependabot[bot], bukan PR manual.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto_merge:
    name: Evaluate and Auto-Merge Dependabot PR
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 5

    steps:
      - name: Fetch Dependabot Metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Evaluate Safety
        id: eval
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          DEPENDENCY_NAMES: ${{ steps.meta.outputs.dependency-names }}
          PACKAGE_ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "Update type  : $UPDATE_TYPE"
          echo "Dependencies : $DEPENDENCY_NAMES"
          echo "Ecosystem    : $PACKAGE_ECOSYSTEM"

          SAFE="true"
          REASON=""

          # Blokir 1: Major version update
          if [[ "$UPDATE_TYPE" == "version-update:semver-major" ]]; then
            SAFE="false"
            REASON="Major version update - perlu review manual agar tidak ada breaking change."
          fi

          # Blokir 2: Dependensi kritis keamanan/DB/build
          # vite: major version pernah break build (vite 6→8 kasus nyata, PR#138)
          # @types/node: major version (v22→v25) menyebabkan TSC error di vite.config.ts
          # decimal.js: financial library inti — semua MathUtils bergantung padanya (audit 2026-06-12)
          CRITICAL_DEPS=("firebase" "dexie" "@firebase/app" "firebase-admin" "@firebase/auth" "vite" "@types/node" "decimal.js")
          for dep in "${CRITICAL_DEPS[@]}"; do
            if echo "$DEPENDENCY_NAMES" | grep -qi "$dep"; then
              SAFE="false"
              REASON="Update dependensi kritis '$dep' - menyentuh auth/DB. Wajib review manual."
              break
            fi
          done

          echo "safe=$SAFE" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"

          if [[ "$SAFE" == "true" ]]; then
            echo "PR AMAN untuk auto-merge (type: $UPDATE_TYPE)"
          else
            echo "PR DITAHAN - $REASON"
          fi

      - name: Approve PR if Safe
        if: steps.eval.outputs.safe == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL" \
            --body "Auto-approved: $UPDATE_TYPE update, CI required to merge."

      - name: Enable Auto-Merge if Safe
        if: steps.eval.outputs.safe == 'true'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Label PR if Blocked
        if: steps.eval.outputs.safe == 'false'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          REASON: ${{ steps.eval.outputs.reason }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMENT_BODY="Auto-merge DITAHAN

          Alasan: $REASON

          Tindakan diperlukan:
          1. Buka PR ini: $PR_URL
          2. Cek perubahan (CHANGELOG atau BREAKING CHANGES)
          3. Jika aman - klik Merge pull request
          4. Jika tidak - klik Close pull request"

          gh pr comment "$PR_URL" --body "$COMMENT_BODY"
          gh pr edit "$PR_URL" --add-label "needs-human-review" 2>/dev/null || true
