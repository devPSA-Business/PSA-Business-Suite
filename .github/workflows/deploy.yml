name: 🚀 Deploy — Produksi Firebase Hosting

# ┌──────────────────────────────────────────────────────────────────────┐
# │  PIPELINE DEPLOY PRODUKSI — PSA Business Suite                       │
# │  Trigger : Push ke main (src/public/config berubah) ATAU manual      │
# │  Output  : https://psa-business-suite.web.app  (HTTPS, CDN global)   │
# │  Biaya   : Rp 0/bulan (Firebase Spark Plan)                          │
# │  Notif   : Email ke dev.psajewelry@gmail.com saat sukses/gagal       │
# └──────────────────────────────────────────────────────────────────────┘
#
# SECRETS WAJIB (deploy gagal tanpa ini):
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID
#   VITE_FIREBASE_APP_ID, FIREBASE_SERVICE_ACCOUNT
#   VITE_CRYPTO_PEPPER
#
# CATATAN: FIREBASE_DEPLOY_TOKEN SUDAH TIDAK DIPERLUKAN.
#   Firestore rules kini di-deploy via service account (FIREBASE_SERVICE_ACCOUNT).
#   Jika masih ada secret FIREBASE_DEPLOY_TOKEN di repo — bisa dihapus.
#
# SECRETS OPSIONAL (fitur disabled jika kosong, app tetap berjalan):
#   VITE_GEMINI_PROXY_URL, VITE_TELEGRAM_BOT_TOKEN, VITE_TELEGRAM_CHAT_ID
#   VITE_RECAPTCHA_SITE_KEY, VITE_SENTRY_DSN, MAIL_USERNAME, MAIL_PASSWORD

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "firebase.json"
      - "firestore.rules"
      - "vite.config.*"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: deploy-produksi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy → Firebase Hosting
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # Diupgrade untuk git tag pada step "Tag rilis produksi"
      id-token: write

    # BUGFIX (Sesi-1, 21 Jul 2026): 'secrets' context TIDAK BOLEH dipakai langsung
    # di dalam if: (GitHub Actions menolak SELURUH workflow file — 0 jobs terjadwal,
    # bukan cuma step ini yang skip). Ref resmi: docs.github.com/actions "Using secrets
    # in GitHub Actions" -> "Secrets cannot be directly referenced in if: conditionals."
    # Solusi: konversi ke job-level env, baca env.* di if: step (env context DIIZINKAN
    # di step-level if, tidak seperti secrets context).
    env:
      MAIL_CONFIGURED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js 22
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # ── Pre-flight: Validasi secrets wajib SEBELUM build ─────────────────
      # Gagal cepat dengan pesan jelas daripada error kriptik saat deploy Firebase.
      - name: Pre-flight — Validasi Secrets Wajib
        id: preflight
        env:
          SA:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          MISSING=()
          [ -z "$SA"  ] && MISSING+=("FIREBASE_SERVICE_ACCOUNT")
          [ -z "$PID" ] && MISSING+=("VITE_FIREBASE_PROJECT_ID")

          if [ ${#MISSING[@]} -ne 0 ]; then
            echo "⚠️  Deploy dilewati — secrets Firebase belum dikonfigurasi:"
            for s in "${MISSING[@]}"; do
              echo "   → $s"
            done
            echo ""
            echo "Cara set: https://github.com/${{ github.repository }}/settings/secrets/actions"
            echo "Panduan lengkap: .github/secrets-checklist.md"
            echo "SECRETS_MISSING=true" >> "$GITHUB_OUTPUT"
          else
            echo "✅ Pre-flight OK — semua secrets wajib tersedia"
            echo "SECRETS_MISSING=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Lint + TypeScript check
        if: steps.preflight.outputs.SECRETS_MISSING != 'true'
        run: npm run lint

      - name: Build produksi (Vite)
        if: steps.preflight.outputs.SECRETS_MISSING != 'true'
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY:             ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:         ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID:          ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET:      ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID:              ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_CRYPTO_PEPPER:                ${{ secrets.VITE_CRYPTO_PEPPER }}
          VITE_RECAPTCHA_SITE_KEY:           ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}
          VITE_GEMINI_PROXY_URL:             ${{ secrets.VITE_GEMINI_PROXY_URL }}
          VITE_TELEGRAM_BOT_TOKEN:           ${{ secrets.VITE_TELEGRAM_BOT_TOKEN }}
          VITE_TELEGRAM_CHAT_ID:             ${{ secrets.VITE_TELEGRAM_CHAT_ID }}
          VITE_SENTRY_DSN:                   ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy ke Firebase Hosting (live)
        if: steps.preflight.outputs.SECRETS_MISSING != 'true'
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@e2eda2e106cfa35cdbcf4ac9ddaf6c4756df2c8c # v0.10.0
        with:
          repoToken:              "${{ secrets.GITHUB_TOKEN }}"
          firebaseServiceAccount: "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}"
          channelId:              live
          projectId:              "${{ secrets.VITE_FIREBASE_PROJECT_ID }}"

      # ── Deploy Firestore Security Rules ──────────────────────────────────
      # PERBAIKAN: Hapus ketergantungan pada FIREBASE_DEPLOY_TOKEN (legacy --token).
      # Firebase CLI kini menggunakan GOOGLE_APPLICATION_CREDENTIALS via service account
      # yang sama (FIREBASE_SERVICE_ACCOUNT) dengan step hosting deploy di atas.
      # Tidak ada secret tambahan yang diperlukan.
      - name: Deploy Firestore Security Rules
        if: steps.preflight.outputs.SECRETS_MISSING != 'true'
        env:
          FIREBASE_SA:  ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          PROJECT_ID:   ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
        run: |
          # Graceful skip jika secrets belum diset (seharusnya sudah tertangkap pre-flight)
          if [ -z "$FIREBASE_SA" ] || [ -z "$PROJECT_ID" ]; then
            echo "::warning::Firestore rules deploy diskip — secrets tidak tersedia."
            exit 0
          fi

          # Tulis service account ke temp file — dihapus setelah dipakai
          SA_PATH="$(mktemp --suffix=.json)"
          printf '%s' "$FIREBASE_SA" > "$SA_PATH"

          # Deploy menggunakan service account (bukan legacy --token yang deprecated)
          GOOGLE_APPLICATION_CREDENTIALS="$SA_PATH" \
            npx firebase-tools deploy --only firestore:rules \
              --project "$PROJECT_ID" \
              --non-interactive

          # Cleanup — jangan tinggalkan credentials di disk
          rm -f "$SA_PATH"
          echo "✅ Firestore security rules berhasil dideploy"

      # ─── ROLLBACK MECHANISM ────────────────────────────────────────────────────
      # Setiap deploy produksi yang berhasil secara otomatis membuat git tag
      # dengan format: prod-YYYYMMDD-HHmm-<7-char-sha>
      #
      # CARA ROLLBACK (manual, jika terjadi bug kritis setelah deploy):
      #   1. Buka GitHub → Actions → "Deploy — Produksi Firebase Hosting"
      #   2. Klik "Run workflow" → pilih tag yang ingin di-rollback
      #   ATAU via terminal:
      #     git checkout <tag-name>
      #     npm install --legacy-peer-deps && npm run build && firebase deploy --only hosting
      #
      # List semua tag produksi: git tag --list 'prod-*' --sort=-creatordate
      # ─────────────────────────────────────────────────────────────────────────
      - name: Tag rilis produksi (untuk rollback)
        if: success()
        # permissions dipindah ke level job (lihat "permissions:" di atas)
        run: |
          TIMESTAMP=$(date -u +"%Y%m%d-%H%M")
          SHORT_SHA="${{ github.sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TAG_NAME="prod-${TIMESTAMP}-${SHORT_SHA}"

          git config user.name  "PSA CI/CD Bot"
          git config user.email "ci@psa-business-suite.internal"
          git tag -a "${TAG_NAME}" -m "Auto-tag deploy produksi ${TIMESTAMP}

          Commit : ${{ github.sha }}
          Pesan  : ${{ github.event.head_commit.message }}
          URL    : https://psa-business-suite.web.app"

          git push origin "${TAG_NAME}"
          echo "ROLLBACK_TAG=${TAG_NAME}" >> $GITHUB_ENV
          echo "✅ Release tag dibuat: ${TAG_NAME}"

      - name: Ringkasan deploy
        if: success()
        run: |
          echo "## ✅ Deploy Produksi Berhasil" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Nilai |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Live URL**      | https://psa-business-suite.web.app |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit**        | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Rollback Tag**  | \`${ROLLBACK_TAG}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔄 Cara Rollback" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# List semua tag produksi:" >> $GITHUB_STEP_SUMMARY
          echo "git tag --list 'prod-*' --sort=-creatordate | head -10" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Rollback ke versi ini:" >> $GITHUB_STEP_SUMMARY
          echo "git checkout ${ROLLBACK_TAG}" >> $GITHUB_STEP_SUMMARY
          echo "npm install --legacy-peer-deps && npm run build && firebase deploy --only hosting" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Email — Deploy berhasil
        if: success() && env.MAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port:    465
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        "[PSA] ✅ Deploy Berhasil — ${{ github.sha }}"
          to:             dev.psajewelry@gmail.com
          from:           PSA Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy PSA Business Suite ke produksi BERHASIL.

            Live URL : https://psa-business-suite.web.app
            Commit   : ${{ github.sha }}
            Pesan    : ${{ github.event.head_commit.message }}

            — PSA CI/CD Bot 🤖

      - name: Email — Deploy gagal
        if: failure() && env.MAIL_CONFIGURED == 'true'
        uses: dawidd6/action-send-mail@2cea9617b09d79a095af21254fbcb7ae95903dde # v3.12.0
        with:
          server_address: smtp.gmail.com
          server_port:    465
          secure:         true
          username:       ${{ secrets.MAIL_USERNAME }}
          password:       ${{ secrets.MAIL_PASSWORD }}
          subject:        "[PSA] ❌ Deploy GAGAL — Perlu Perhatian"
          to:             dev.psajewelry@gmail.com
          from:           PSA Bot <${{ secrets.MAIL_USERNAME }}>
          body: |
            Deploy PSA Business Suite GAGAL.

            Commit : ${{ github.sha }}
            Log    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            — PSA CI/CD Bot 🤖
